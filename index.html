<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>0202 Works</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f7;--card:#fff;--fg:#17181a;--muted:#6d7079;--line:#e8e9ec;--head:#f8f8f9;--blue:#3a63e8;--green:#b9f0b4;--green-fg:#1d5c22;--pink:#ecb3ee;--pink-fg:#6d1b70;--lav:#e3e1fb;--lav-fg:#463c9a;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:15px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input{font:inherit;letter-spacing:inherit}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:16px}
.gate form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 32px;width:min(100%,360px);display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.gate .logo{margin:0 auto 4px}
.gate p{margin:0;color:var(--muted);font-size:14px}
.gate input{padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--head);text-align:center;letter-spacing:.35em;font-size:17px;outline:none}
.gate input:focus{border-color:var(--blue)}
.gate button{padding:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
.gate .err{color:#d43b3b;min-height:1.2em;font-size:13px}

/* frame */
.frame{max-width:1440px;margin:28px auto;background:var(--card);border:1px solid var(--line);border-radius:24px;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 56px);overflow:hidden}
.logo{font-family:Lora,Georgia,serif;font-weight:700;font-size:28px;letter-spacing:-.02em;margin:0}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:28px 0 22px}
.side .logo{padding:0 28px 34px}
.nav{display:flex;flex-direction:column;gap:6px;padding:0 16px}
.nav button,.plist button,.sfoot button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--fg);padding:11px 14px;border-radius:10px;cursor:pointer;text-align:left;font-size:16px}
.nav button svg{color:#474a52}
.nav button:hover,.plist button:hover,.sfoot button:hover{background:var(--head)}
.nav button.on{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(58,99,232,.25)}
.nav button.on svg{color:#fff}
.nav .lbl{flex:1;white-space:nowrap}
.side hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.phead{display:flex;align-items:center;justify-content:space-between;padding:0 30px 10px;font-size:16px;font-weight:500}
.plist{display:flex;flex-direction:column;gap:2px;padding:0 16px}
.plist button{gap:16px}
.plist i{width:16px;height:16px;border-radius:4px;flex:none}
.plist .lbl{flex:1}
.plist .n,.nav .n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav button.on .n{color:rgba(255,255,255,.8)}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding:24px 16px 0}
.sfoot button{color:#3b3e45}
.badge{margin-left:auto;background:var(--green);color:var(--green-fg);font-size:13px;border-radius:6px;padding:1px 8px;font-weight:500}
.c1{background:#e7a3ea}.c2{background:#9fb4f5}.c3{background:#f7b2a4}.c4{background:#a8e8a4}

.top{display:flex;align-items:center;gap:16px;padding:14px 32px;border-bottom:1px solid var(--line)}
.search{flex:1;max-width:620px;display:flex;align-items:center;gap:10px;background:var(--head);border-radius:12px;padding:8px 10px 8px 16px;color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:none;color:var(--fg);font-size:15.5px}
.search input::placeholder{color:#5f626a}
.kbd{background:#fff;border-radius:7px;padding:3px 9px;font-size:13px;color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid #d7d9de;background:#fff;color:var(--fg);border-radius:10px;padding:9px 16px;cursor:pointer;font-size:15px}
.btn:hover{border-color:#bfc2c9}
.btn svg{width:18px;height:18px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#3a63e8,#a066e0);color:#fff;display:grid;place-items:center;font-weight:600;position:relative}
.avatar::after{content:"";position:absolute;right:-1px;top:-1px;width:9px;height:9px;border-radius:50%;background:#e2a0ef;border:2px solid #fff}

main{padding:30px 32px 40px;min-width:0}
.hrow{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hrow .tt{flex:1;min-width:0}
.date{color:#585b63;margin:0;font-size:16px}
h1.hi{font-size:clamp(30px,4vw,46px);font-weight:600;letter-spacing:-.035em;margin:8px 0 0;line-height:1.15}
.stats{display:flex;flex-wrap:wrap;align-items:center;background:var(--head);border:1px solid var(--line);border-radius:999px;padding:16px 28px;margin-top:28px;width:fit-content;max-width:100%;gap:0}
.stat{display:flex;align-items:center;gap:10px;padding:0 22px;border-left:1px solid #dcdde1}
.stat:first-child{padding-left:0;border-left:0}
.stat:last-child{padding-right:0}
.stat b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{color:#55585f;font-size:15.5px}

.card{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;min-width:0;margin-top:28px}
.ch{display:flex;align-items:center;gap:14px;padding:18px 24px;flex-wrap:wrap}
.ch h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.025em;display:flex;align-items:center;gap:12px}
.ch .sp{flex:1}
.tree{border-top:1px solid var(--line);padding:6px 24px 14px}
.grp{padding:12px 0 4px;border-bottom:1px dashed var(--line)}
.grp:last-child{border-bottom:0}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.kind{font-weight:600;font-size:16px;padding:2px 0}
.gl li>.pill{margin-top:1px;min-width:72px;text-align:center}
.gl li>.d{min-width:52px;text-align:right}
.dbtn{margin-top:8px;border:1px solid #d7d9de;background:#fff;border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;color:var(--fg)}
.dbtn:hover{border-color:var(--blue);color:var(--blue)}
.dbox{margin-top:10px;background:var(--head);border:1px solid var(--line);border-radius:12px;padding:14px 16px;white-space:pre-wrap;font-size:14px;line-height:1.65;color:#33363c}
.gn{color:var(--muted);font-size:13.5px}
.gl{margin:0;padding:0 0 0 26px;border-left:2px solid var(--line);margin-left:14px;list-style:none;counter-reset:n}
.gl li{counter-increment:n;display:flex;align-items:flex-start;gap:12px;padding:10px 0 10px 4px;position:relative}
.gl li::before{content:counter(n);position:absolute;left:-40px;top:11px;width:26px;height:22px;background:var(--card);color:var(--muted);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.gt{flex:1;min-width:0;font-size:15.5px}
.cnt2{margin-left:auto;color:var(--muted);font-size:14px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;border:1px solid #d7d9de;background:#fff;border-radius:8px;padding:7px 34px 7px 14px;font:inherit;font-size:15px;cursor:pointer;color:var(--fg)}
.sel::after{content:"";position:absolute;right:13px;top:50%;margin-top:-2px;border:5px solid transparent;border-top-color:#222;pointer-events:none}
.ghost{border:0;background:var(--head);border-radius:999px;padding:9px 20px;cursor:pointer;font-size:15px;color:var(--fg)}
.ghost:hover{background:#eeeff1}

.tbl{width:100%;border-collapse:collapse;border-top:1px solid var(--line)}
.tbl th{text-align:left;font-weight:500;font-size:17px;padding:14px 24px;background:var(--head);border-bottom:1px solid var(--line)}
.tbl th>span{display:inline-flex;align-items:center;gap:12px}
.tbl td{padding:15px 24px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th+th,.tbl td+td{border-left:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#fbfbfc}
.tcell{display:flex;align-items:center;gap:12px;color:#33363c}
.tcell svg{color:#4b4e56}
.tcell .meta{margin-left:auto;display:flex;gap:14px;color:var(--muted);font-size:14px;white-space:nowrap}
.tag{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:600;color:var(--blue);background:#e8eefc;border-radius:5px;padding:1px 6px;vertical-align:2px}
.sub{display:block;color:var(--muted);font-size:13.5px;margin-top:3px}
.who{display:flex;align-items:center;gap:12px;white-space:nowrap}
.who i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;color:#2b2d31}
.pill{display:inline-block;font-size:14px;padding:4px 14px;border-radius:999px;white-space:nowrap;font-weight:500;border:1px solid transparent}
.p-진행중{background:var(--green);color:var(--green-fg)}
.p-대기{background:var(--pink);color:var(--pink-fg)}
.p-아이디어{background:var(--lav);color:var(--lav-fg)}
.p-완료{background:var(--blue);color:#fff;border-color:#2c51c9}
.d{color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty td{color:var(--muted);text-align:center;font-size:14px;padding:30px}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr));gap:24px}
.two .card{margin-top:24px}
.days{display:grid;grid-template-columns:repeat(7,1fr);padding:4px 16px 16px;border-bottom:1px solid var(--line)}
.days button{border:0;background:none;border-radius:8px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--fg);margin:0 auto;width:48px}
.days button small{font-size:13px;color:#3b3e45}
.days button b{font-size:17px;font-weight:500}
.days button.has b::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--blue);margin:2px auto 0}
.days button.on{background:var(--pink);color:var(--pink-fg)}
.days button.on small{color:var(--pink-fg)}
.sched{list-style:none;margin:0;padding:6px 24px 10px}
.sched li{display:flex;gap:16px;padding:16px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.sched li:last-child{border-bottom:0}
.sched .bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.sched .tx{flex:1;min-width:0}
.sched .tx b{display:flex;align-items:center;gap:10px;font-weight:500;font-size:16px}
.sched .tx span{display:block;color:var(--muted);font-size:14px;margin-top:6px}
.sched .empty{color:var(--muted);font-size:14px;justify-content:center;border:0}
.notes{list-style:none;margin:0;padding:8px 24px 12px;border-top:1px solid var(--line)}
.notes li{display:flex;gap:16px;padding:18px 0;border-bottom:1px dashed var(--line)}
.notes li:last-child{border-bottom:0}
.notes .o{width:24px;height:24px;border-radius:50%;border:1.6px solid #44474e;flex:none;display:grid;place-items:center}
.notes li.done .o{background:var(--pink);border-color:var(--pink)}
.notes li.done .o::after{content:"";width:8px;height:4px;border-left:2px solid var(--pink-fg);border-bottom:2px solid var(--pink-fg);transform:rotate(-45deg) translate(1px,-1px)}
.notes b{display:block;font-weight:500;font-size:16.5px}
.notes li.done b{text-decoration:line-through;color:#55585f}
.notes span{display:block;color:#55585f;font-size:14px;margin-top:6px;line-height:1.5}

@media (max-width:820px){
 .frame{grid-template-columns:minmax(0,1fr);margin:0;border-radius:0;border:0;min-height:100vh}
 .side{border-right:0;border-bottom:1px solid var(--line);padding:16px 0 10px}
 .side .logo{padding:0 20px 12px;font-size:24px}
 .nav{flex-direction:row;overflow-x:auto;padding:0 12px}
 .nav button{white-space:nowrap;font-size:15px;padding:9px 12px}
 .side hr,.phead,.plist,.sfoot{display:none}
 .top{padding:12px 16px}
 .kbd,.avatar{display:none}
 .stats{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:10px 0}
 .stat:nth-child(odd){padding-left:0;border-left:0}
 .stat b{font-size:20px}
 main{padding:22px 16px 32px}
 .stats{padding:12px 18px;border-radius:18px}
 .stat{padding:4px 14px}
 .col-x{display:none}
 .tbl th,.tbl td{padding:12px 14px}
 .tcell .meta{display:none}
}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form id="gf">
    <p class="logo">0202 Works</p>
    <p>비밀번호를 입력하세요</p>
    <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" autofocus>
    <button type="submit">열기</button>
    <p class="err" id="err"></p>
  </form>
</div>

<div class="frame" id="app" hidden>
  <aside class="side">
    <p class="logo">0202 Works</p>
    <nav class="nav" id="nav"></nav>
    <hr>
    <div class="phead">주제 <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
    <div class="plist" id="plist"></div>
    <div class="sfoot">
      <button id="lock"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>잠그기</button>
      <button id="upd"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>업데이트<span class="badge">11.08</span></button>
    </div>
  </aside>

  <div style="min-width:0;display:flex;flex-direction:column">
    <div class="top">
      <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="작업 검색"><span class="kbd">⌘ K</span></label>
      <span class="sp"></span>
      <div class="avatar">J</div>
    </div>
    <main id="main"></main>
  </div>
</div>

const ORDER = {'진행중':0,'대기':1,'아이디어':2,'완료':3};
const DOW = ['일','월','화','수','목','금','토'];

async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.ct))));
}
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const html = (tag, cls, h) => { const e = el(tag, cls); e.innerHTML = h; return e; };
const fmt = (s) => { const d = new Date(s + 'T00:00:00'); return isNaN(d) ? s : (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; };
const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const fresh = (r) => { if (!r.changed) return false; const d = new Date(r.changed + 'T00:00:00'); return (Date.now() - d) / 864e5 < 2; };
const openN = (k) => ITEMS.filter((r) => r.area === k && r.status !== '완료').length;
const sorted = (rows) => rows.slice().sort((a, b) => (ORDER[a.status] - ORDER[b.status]) || (b.updated > a.updated ? 1 : -1));

function side(){
  const nav = document.getElementById('nav'); nav.replaceChildren();
  [{key:'home', name:'대시보드', ic:'grid'}].concat(AREAS).forEach((a) => {
    const b = html('button', tab === a.key ? 'on' : '', svg(a.ic) + '<span class="lbl"></span>' + (a.key === 'home' ? '' : '<span class="n"></span>'));
    b.querySelector('.lbl').textContent = a.name;
    if (a.key !== 'home') b.querySelector('.n').textContent = openN(a.key);
    b.onclick = () => go(a.key); nav.append(b);
  });
  const pl = document.getElementById('plist'); pl.replaceChildren();
  AREAS.forEach((a) => { const b = html('button', '', '<i class="' + a.c + '"></i><span class="lbl"></span>'); b.querySelector('.lbl').textContent = a.name; b.onclick = () => go(a.key); pl.append(b); });
}

function table(rows, opts){
  const t = el('table', 'tbl');
  const h = el('tr');
  h.append(html('th', '', '<span>' + svg('pen') + '작업</span>'));
  if (opts.area) h.append(html('th', 'col-x', '<span>' + svg('users') + '주제</span>'));
  if (opts.date) h.append(html('th', 'col-x', '<span>' + svg('cal') + '업데이트</span>'));
  h.append(html('th', '', '<span>' + svg('load') + '상태</span>'));
  const th = el('thead'); th.append(h); t.append(th);
  const tb = el('tbody'); t.append(tb);
  if (!rows.length) { const tr = el('tr', 'empty'); const td = el('td', '', '해당 항목 없음'); td.colSpan = 4; tr.append(td); tb.append(tr); return t; }
  rows.forEach((r) => {
    const a = area(r.area); const tr = el('tr');
    const c1 = el('td'); const tc = html('div', 'tcell', svg(a.ic)); const tx = el('div');
    tx.append(document.createTextNode(r.title)); if (fresh(r)) tx.append(el('span', 'tag', r.change || '업데이트')); tx.append(el('span', 'sub', r.next)); tc.append(tx); c1.append(tc); tr.append(c1);
    if (opts.area) { const c = el('td', 'col-x'); const w = html('div', 'who', '<i class="' + a.c + '"></i>'); const tw = el('div'); tw.append(document.createTextNode(r.topic || a.name), el('span', 'sub', a.name)); w.append(tw); c.append(w); tr.append(c); }
    if (opts.date) tr.append(el('td', 'd col-x', fmt(r.updated)));
    const cs = el('td'); cs.append(el('span', 'pill p-' + r.status, r.status)); tr.append(cs);
    tb.append(tr);
  });
  return t;
}

  s.value = value; s.onchange = () => onChange(s.value); w.append(s); return w;
}

function home(m){

  const st = el('div', 'stats');
  [['clock', ITEMS.length, '전체 항목'], ['check', ITEMS.filter((r) => r.status === '완료').length, '완료'], ['hour', ITEMS.filter((r) => r.status === '진행중').length, '진행중'], ['note', ITEMS.filter((r) => r.status === '대기').length, '결정 대기']]
    .forEach(([i, n, l]) => { const d = html('div', 'stat', svg(i)); d.append(el('b', '', n), el('span', '', l)); st.append(d); });
  m.append(st);

  const c = el('div', 'card'); const h = cardHead('list', '내 작업');

  const two = el('div', 'two');

  const wk = el('div', 'card'); const wh = cardHead('cal', '이번 주 업데이트'); wk.append(wh);
  const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const week = [...Array(7)].map((_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  if (!day) { const withItems = week.map(iso).filter((s) => ITEMS.some((r) => r.updated === s)); day = withItems.includes(iso(now)) ? iso(now) : (withItems.pop() || iso(now)); }
  const ds = el('div', 'days');

  const ul = el('ul', 'sched'); const todays = sorted(ITEMS.filter((r) => r.updated === day));
  if (!todays.length) ul.append(el('li', 'empty', '이날 업데이트 없음'));
  todays.forEach((r) => { const a = area(r.area); const li = el('li'); li.append(el('i', 'bar ' + a.c)); const tx = el('div', 'tx'); const b = html('b', '', svg(a.ic)); b.append(document.createTextNode(r.title)); tx.append(b, el('span', '', r.next)); li.append(tx); const p = el('span', 'pill p-' + r.status, r.status); li.append(p); ul.append(li); });
  wk.append(ul); two.append(wk);
  // decisions
  const nt = el('div', 'card'); nt.append(cardHead('note', '결정할 것'));
  const nl = el('ul', 'notes');
  ITEMS.filter((r) => r.status === '대기').concat(ITEMS.filter((r) => r.status === '완료').sort((a, b) => b.updated > a.updated ? 1 : -1).slice(0, 2)).forEach((r) => {
    const li = el('li', r.status === '완료' ? 'done' : ''); li.append(el('i', 'o')); const d = el('div'); d.append(el('b', '', r.title), el('span', '', r.next)); li.append(d); nl.append(li);
  });
  nt.append(nl); two.append(nt); m.append(two);
}

function areaPage(m){
  const a = area(tab);
  const hr = el('div', 'hrow'); const tt = el('div', 'tt');
  tt.append(el('p', 'date', a.desc), el('h1', 'hi', a.key === '블로그' ? '블로그 작성 리스트' : a.name)); hr.append(tt); m.append(hr);
  const rows = ITEMS.filter((r) => r.area === tab);
  const st = el('div', 'stats');
  [['hour','진행중'],['note','대기'],['clock','아이디어'],['check','완료']].forEach(([i, s]) => { const d = html('div', 'stat', svg(i)); d.append(el('b', '', rows.filter((r) => r.status === s).length), el('span', '', s)); st.append(d); });
  m.append(st);
  const bar = el('div', 'ch'); bar.style.padding = '28px 0 0'; bar.append(el('span', 'sp'), select(filt, (v) => { filt = v; render(); }, true)); m.append(bar);
  const topics = [...new Set(sorted(rows).map((r) => r.topic || '기타'))];
  topics.forEach((tp) => {
    const tr = rows.filter((r) => (r.topic || '기타') === tp);
    const shown = tr.filter((r) => !filt || r.status === filt);
    if (filt && !shown.length) return;
    const c = el('div', 'card'); c.style.marginTop = '18px'; const h = cardHead(a.ic, tp);
    h.append(el('span', 'cnt2', tr.filter((r) => r.status === '완료').length + ' / ' + tr.length + ' 완료'));
    c.append(h);
    const tree = el('div', 'tree');
    const byKind = tr.some((r) => r.kind);
    const groups = byKind ? ['릴스', '캐러셀', '미분류'] : ['진행중', '대기', '아이디어', '완료'];
    groups.forEach((st) => {
      const g = shown.filter((r) => byKind ? (r.kind || '미분류') === st : r.status === st).sort((x, y) => (ORDER[x.status] - ORDER[y.status]) || (y.updated > x.updated ? 1 : -1));
      if (!g.length) return;
      const grp = el('div', 'grp');
      const gh = el('div', 'gh'); gh.append(byKind ? el('span', 'kind', st) : el('span', 'pill p-' + st, st), el('span', 'gn', g.length + '개')); grp.append(gh);
      const ol = el('ol', 'gl');
      g.forEach((r) => {
        const li = el('li'); const tx = el('div', 'gt');
        tx.append(document.createTextNode(r.title)); if (fresh(r)) tx.append(el('span', 'tag', r.change || '업데이트'));
        tx.append(el('span', 'sub', r.next));
        if (r.detail) {
          const bt = el('button', 'dbtn', '대본·기획 보기'); const pre = el('div', 'dbox', r.detail); pre.hidden = true;
          bt.onclick = () => { pre.hidden = !pre.hidden; bt.textContent = pre.hidden ? '대본·기획 보기' : '접기'; };
          tx.append(bt, pre);
        }
        li.append(tx); if (byKind) li.append(el('span', 'pill p-' + r.status, r.status)); li.append(el('span', 'd', fmt(r.updated))); ol.append(li);
      });
      grp.append(ol); tree.append(grp);
    });
    c.append(tree); m.append(c);
  });
}

function searchPage(m){
  m.append(el('p', 'date', '검색 결과'), el('h1', 'hi', '“' + q + '”'));
  const rows = ITEMS.filter((r) => (r.title + ' ' + r.next + ' ' + r.area).toLowerCase().includes(q.toLowerCase()));
  const c = el('div', 'card'); c.append(cardHead('list', rows.length + '개 항목'), table(sorted(rows), {area:true, date:true})); m.append(c);
}

function render(){
  side();
  const m = document.getElementById('main'); m.replaceChildren();
  if (q) searchPage(m); else if (tab === 'home') home(m); else areaPage(m);
}
function go(t){ tab = t; filt = ''; q = ''; document.getElementById('q').value = ''; history.replaceState(null, '', '#' + encodeURIComponent(t)); render(); window.scrollTo(0, 0); }

const qi = document.getElementById('q');
qi.oninput = () => { q = qi.value.trim(); render(); };
document.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); qi.focus(); } if (e.key === 'Escape' && document.activeElement === qi) { qi.value = ''; q = ''; render(); qi.blur(); } });

async function start(pw, remember){
  ITEMS = await unlock(pw);
  if (remember) try { localStorage.setItem('w0202', pw); } catch (e) {}
  document.getElementById('gate').hidden = true; document.getElementById('app').hidden = false;
  const h = decodeURIComponent(location.hash.slice(1)); if (h === 'home' || area(h)) tab = h;
  render();
}
document.getElementById('gf').onsubmit = async (e) => { e.preventDefault(); try { await start(document.getElementById('pw').value, true); } catch (x) { document.getElementById('err').textContent = '비밀번호가 맞지 않아요'; } };
document.getElementById('lock').onclick = () => { try { localStorage.removeItem('w0202'); } catch (e) {} location.reload(); };
document.getElementById('upd').onclick = () => location.reload();
try { const s = localStorage.getItem('w0202'); if (s) start(s, false).catch(() => localStorage.removeItem('w0202')); } catch (e) {}
</script>
