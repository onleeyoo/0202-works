<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>0202 Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f6f6f8;--card:#fff;--fg:#151618;--muted:#6b6f78;--line:#e6e7eb;--panel:#f3f4f6;--blue:#3d63dd;--serif:"Noto Serif KR",Georgia,serif;--sans:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f1012;--card:#17181b;--fg:#ececee;--muted:#9a9ea7;--line:#2a2c31;--panel:#1f2125}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px}
.gate{min-height:100vh;display:grid;place-items:center;padding:16px}
.gate form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px 32px;width:min(100%,360px);display:flex;flex-direction:column;gap:14px;text-align:center}
.gate h1{font-family:var(--serif);font-weight:400;margin:0;font-size:28px}
.gate p{margin:0;color:var(--muted);font-size:13px}
.gate input{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-align:center;letter-spacing:.3em}
.gate button{font:inherit;padding:12px;border:0;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer}
.gate .err{color:#d33;min-height:1em}
.frame{max-width:1440px;margin:24px auto;background:var(--card);border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:15rem minmax(0,1fr);min-height:calc(100vh - 48px);overflow:hidden}
.side{border-right:1px solid var(--line);padding:32px 16px;display:flex;flex-direction:column;gap:22px}
.brand{font-family:var(--serif);font-size:26px;margin:0 8px}
.brand small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:4px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:10px;font:inherit;text-align:left;border:0;background:none;color:var(--fg);padding:11px 14px;border-radius:10px;cursor:pointer}
nav button:hover{background:var(--panel)}
nav button.on{background:var(--blue);color:#fff}
nav button.on .cnt{background:rgba(255,255,255,.22);color:#fff}
nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav .lbl{flex:1}
.cnt{font-size:12px;background:var(--panel);color:var(--muted);border-radius:999px;padding:0 8px;min-width:1.4em;text-align:center}
.sep{height:1px;background:var(--line);margin:0 8px}
.legend{display:flex;flex-direction:column;gap:9px;padding:0 10px;font-size:13px}
.legend p{margin:0 0 2px;color:var(--muted);font-size:12px}
.legend span{display:flex;align-items:center;gap:9px}
.legend i,.area i{width:12px;height:12px;border-radius:3px;display:inline-block}
.side .foot{margin-top:auto;padding:0 10px;font-size:12px;color:var(--muted)}
.side .foot button{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;text-decoration:underline}
main{padding:36px clamp(16px,3vw,40px);min-width:0}
.date{color:var(--muted);margin:0}
.hi{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,42px);margin:6px 0 0;line-height:1.2}
.stats{display:flex;flex-wrap:wrap;gap:16px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:13px 24px;width:fit-content;max-width:100%;margin-top:22px}
.stat{display:flex;align-items:baseline;gap:6px;padding-right:16px;border-right:1px solid var(--line)}
.stat:last-child{border:0;padding:0}
.stat b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr));gap:16px;margin-top:28px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;min-width:0}
.card.wide{grid-column:1/-1}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid var(--line)}
.ch h2{margin:0;font-size:18px;font-weight:600;flex:1}
.ch .note{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
td{padding:14px 22px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.t{font-weight:600}
td.t small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
td.n,td.d{color:var(--muted)}
td.d{font-size:13px;white-space:nowrap}
.empty td{color:var(--muted);text-align:center;font-size:13px}
.pill{display:inline-block;font-size:12.5px;padding:3px 12px;border-radius:999px;white-space:nowrap;font-weight:500}
.p-진행중{background:#c9f0cf;color:#17612a}.p-대기{background:#f2c9f0;color:#7c1f78}.p-아이디어{background:#e4e0ff;color:#4b3aa8}.p-완료{background:var(--blue);color:#fff}
.notes{list-style:none;margin:0;padding:4px 22px}
.notes li{display:flex;gap:12px;padding:14px 0;border-bottom:1px dashed var(--line)}
.notes li:last-child{border:0}
.notes .o{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--muted);flex:none;margin-top:2px}
.notes b{display:block;font-weight:600}
.notes span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));gap:10px;padding:22px}
.area{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card);font:inherit;text-align:left;color:var(--fg);cursor:pointer}
.area:hover{border-color:var(--blue)}
.area .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.area .big{font-family:var(--serif);font-size:30px;display:block;margin-top:6px}
.area .sm{color:var(--muted);font-size:12px}
.c1{background:#9b4fd8}.c2{background:#3d63dd}.c3{background:#e8649a}.c4{background:#4cbf6b}
[hidden]{display:none!important}
@media (max-width:760px){
 .frame{grid-template-columns:1fr;margin:0;border-radius:0;border:0}
 .side{border-right:0;border-bottom:1px solid var(--line);padding:16px}
 nav{flex-direction:row;overflow-x:auto}
 nav button{white-space:nowrap}
 .sep,.legend,.side .foot{display:none}
 .col-d{display:none}
}
</style>
</head>

const ORDER = {'진행중':0,'대기':1,'아이디어':2,'완료':3};
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
let ITEMS = [], tab = 'home', filt = '';

async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const pill = (s) => { const td = el('td'); td.append(el('span', 'pill p-' + s, s)); return td; };
const fmt = (s) => { const d = new Date(s); return isNaN(d) ? s : (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; };
const open = (a) => ITEMS.filter((r) => r.area === a && r.status !== '완료').length;

function table(rows, withArea, withDate){
  const t = el('table'); const h = el('tr');
  ['작업','다음 할 일','상태'].concat(withDate ? ['업데이트'] : []).forEach((x, i) => { const th = el('th', i === 3 ? 'col-d' : '', x); h.append(th); });
  const th = el('thead'); th.append(h); t.append(th);
  const tb = el('tbody'); t.append(tb);
  if (!rows.length) { const tr = el('tr', 'empty'); const td = el('td', '', '해당 항목 없음'); td.colSpan = 4; tr.append(td); tb.append(tr); }
  rows.forEach((r) => {
    const tr = el('tr'); const tt = el('td', 't', r.title);
    if (withArea) tt.append(el('small', '', r.area));
    tr.append(tt, el('td', 'n', r.next), pill(r.status));
    if (withDate) tr.append(el('td', 'd col-d', fmt(r.updated)));
    tb.append(tr);
  });
  return t;
}
function card(title, note, body, wide){
  const c = el('div', 'card' + (wide ? ' wide' : '')); const h = el('div', 'ch');
  h.append(el('h2', '', title)); if (typeof note === 'string') h.append(el('span', 'note', note)); else h.append(note);
  c.append(h, body); return c;
}

    const g = el('div', 'grid');
    g.append(card('지금 진행 중', '모든 주제', table(ITEMS.filter((r) => r.status === '진행중'), true, false), true));
    const ar = el('div', 'areas');
    AREAS.forEach(([a, c]) => { const b = el('button', 'area'); const nm = el('span', 'nm'); nm.append(el('i', c), document.createTextNode(a)); b.append(nm, el('span', 'big', open(a)), el('span', 'sm', '진행·대기·아이디어')); b.onclick = () => go(a); ar.append(b); });
    g.append(card('주제별', '열린 항목 수', ar));
    const ul = el('ul', 'notes');
    ITEMS.filter((r) => r.status === '대기').forEach((r) => { const li = el('li'); const box = el('div'); box.append(el('b', '', r.title), el('span', '', r.next)); li.append(el('i', 'o'), box); ul.append(li); });
    g.append(card('결정할 것', '대기 중인 항목', ul));
    m.append(g);
  } else {
    const info = AREAS.find((x) => x[0] === tab);
    m.append(el('h1', 'hi', tab === '블로그' ? '블로그 작성 리스트' : tab), el('p', 'date', info[2]));
    const chips = el('div', 'chips');
    ['', '진행중', '대기', '아이디어', '완료'].forEach((s) => { const b = el('button', s === filt ? 'on' : '', s || '전체'); b.onclick = () => { filt = s; render(); }; chips.append(b); });
    const rows = ITEMS.filter((r) => r.area === tab && (!filt || r.status === filt)).sort((a, b) => (ORDER[a.status] - ORDER[b.status]) || (b.updated > a.updated ? 1 : -1));
    const g = el('div', 'grid'); g.append(card('전체 목록', chips, table(rows, false, true), true)); m.append(g);
  }
}
function go(t){ tab = t; filt = ''; history.replaceState(null, '', '#' + encodeURIComponent(t)); render(); window.scrollTo(0, 0); }
document.querySelectorAll('nav button').forEach((b) => b.onclick = () => go(b.dataset.tab));

async function start(pw, remember){
  ITEMS = await unlock(pw);
  if (remember) try { localStorage.setItem('w0202', pw); } catch (e) {}
  document.getElementById('gate').hidden = true; document.getElementById('app').hidden = false;
  const h = decodeURIComponent(location.hash.slice(1)); if (h === 'home' || AREAS.some((a) => a[0] === h)) tab = h;
  render();
}
document.getElementById('gf').onsubmit = async (e) => {
  e.preventDefault();
  try { await start(document.getElementById('pw').value, true); } catch (x) { document.getElementById('err').textContent = '비밀번호가 맞지 않아요'; }
};
document.getElementById('lock').onclick = () => { try { localStorage.removeItem('w0202'); } catch (e) {} location.reload(); };
try { const s = localStorage.getItem('w0202'); if (s) start(s, false).catch(() => localStorage.removeItem('w0202')); } catch (e) {}
</script>
